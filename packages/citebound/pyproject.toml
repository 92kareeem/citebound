[project]
name = "citebound"
version = "0.2.1"
description = "Bind every claim an LLM makes to the passage it cites. Deterministic, dependency-free verification for RAG and agent answers: every number and citation checked against the retrieved context, wrong citations repaired, unsupported sentences stripped, ungroundable answers refused. No model call, no API key."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "hallucination",
    "hallucination-detection",
    "llm",
    "llm-guardrails",
    "guardrails",
    "grounding",
    "groundedness",
    "faithfulness",
    "citations",
    "citation-verification",
    "fact-checking",
    "llm-evaluation",
    "ai-safety",
    "langchain",
    "llamaindex",
    "openai",
    "agents",
    "ai-agents",
    "answer-verification",
    "citebound",
    "benchmark",
    "no-api-key",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/92kareeem/citebound"
Documentation = "https://github.com/92kareeem/citebound/tree/main/packages/citebound"
Source = "https://github.com/92kareeem/citebound/tree/main/packages/citebound/src/citebound"
Changelog = "https://github.com/92kareeem/citebound/blob/main/packages/citebound/CHANGELOG.md"
Issues = "https://github.com/92kareeem/citebound/issues"

[project.scripts]
citebound = "citebound.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
citebound = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Newer ruff also formats the Python blocks inside Markdown. The README's
# examples align their comments deliberately, so they are left alone.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
