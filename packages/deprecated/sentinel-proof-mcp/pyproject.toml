[project]
name = "sentinel-proof-mcp"
version = "0.1.3"
description = "Renamed to citebound-mcp. This is the final sentinel-proof-mcp release: it installs citebound-mcp and forwards to it. Please use `uvx citebound-mcp`."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["citebound", "mcp", "mcp-server", "deprecated", "renamed", "hallucination", "citations"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["citebound-mcp>=0.2.0"]

[project.urls]
Homepage = "https://github.com/92kareeem/citebound"
"New package" = "https://pypi.org/project/citebound-mcp/"
Changelog = "https://github.com/92kareeem/citebound/blob/main/packages/citebound-mcp/CHANGELOG.md"
Issues = "https://github.com/92kareeem/citebound/issues"

[project.scripts]
sentinel-proof-mcp = "sentinel_proof_mcp.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
