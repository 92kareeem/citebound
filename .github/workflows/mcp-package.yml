name: sentinel-proof-mcp (deprecated shim)

# `sentinel-proof-mcp` was renamed to `citebound-mcp`. This workflow publishes
# only the final `sentinel-proof-mcp` release: a shim that forwards to the
# renamed server so existing MCP client configs keep working.
#
# Its FILENAME is deliberately unchanged, because PyPI trusted publishing is
# bound to the workflow file path. See proof-package.yml for the same note.
#
# Publish with tag `sentinel-proof-mcp-v0.1.3`. There is no release after it.
# It is not listed in the MCP registry: the registry entry for the renamed
# server is published by citebound-mcp-package.yml.

on:
  push:
    branches: [main]
    paths:
      - "packages/deprecated/sentinel-proof-mcp/**"
      - ".github/workflows/mcp-package.yml"
    tags: ["sentinel-proof-mcp-v*"]
  pull_request:
    paths:
      - "packages/deprecated/sentinel-proof-mcp/**"
      - ".github/workflows/mcp-package.yml"

defaults:
  run:
    working-directory: packages/deprecated/sentinel-proof-mcp

jobs:
  test:
    name: The shim forwards to citebound-mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ../../citebound ../../citebound-mcp
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-proof-mcp-shim-dist
          path: packages/deprecated/sentinel-proof-mcp/dist/

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/sentinel-proof-mcp-v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
      contents: write # the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sentinel-proof-mcp-shim-dist
          path: dist/
      - name: The tag matches the shim version
        working-directory: .
        run: |
          tag="${GITHUB_REF_NAME#sentinel-proof-mcp-v}"
          ls dist/ | grep -q "sentinel_proof_mcp-${tag}-" || { echo "tag $tag does not match dist/"; ls dist; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "sentinel-proof-mcp ${GITHUB_REF_NAME#sentinel-proof-mcp-v} (renamed to citebound-mcp)" \
            --notes "Final release under the old name. Use \`uvx citebound-mcp\` instead: https://pypi.org/project/citebound-mcp/"
