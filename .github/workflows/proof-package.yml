name: sentinel-proof (deprecated shim)

# `sentinel-proof` was renamed to `citebound`. This workflow exists only to
# publish the final `sentinel-proof` release: a shim that depends on citebound
# and re-exports it, so pinned installs keep working.
#
# Its FILENAME is deliberately unchanged. PyPI trusted publishing is bound to
# the workflow file path, so renaming this file would invalidate the publisher
# already configured for the `sentinel-proof` project. The citebound packages
# have their own workflows, and their own publishers.
#
# Publish with tag `sentinel-proof-v0.1.3`. There is no release after it.

on:
  push:
    branches: [main]
    paths:
      - "packages/deprecated/sentinel-proof/**"
      - ".github/workflows/proof-package.yml"
    tags: ["sentinel-proof-v*"]
  pull_request:
    paths:
      - "packages/deprecated/sentinel-proof/**"
      - ".github/workflows/proof-package.yml"

defaults:
  run:
    working-directory: packages/deprecated/sentinel-proof

jobs:
  test:
    name: The shim forwards to citebound
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The renamed package from this checkout, not PyPI: the shim has to be
      # proven against the version it will ship beside.
      - run: pip install ../../citebound
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-proof-shim-dist
          path: packages/deprecated/sentinel-proof/dist/

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/sentinel-proof-v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
      contents: write # the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sentinel-proof-shim-dist
          path: dist/
      - name: The tag matches the shim version
        working-directory: .
        run: |
          tag="${GITHUB_REF_NAME#sentinel-proof-v}"
          ls dist/ | grep -q "sentinel_proof-${tag}-" || { echo "tag $tag does not match dist/"; ls dist; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "sentinel-proof ${GITHUB_REF_NAME#sentinel-proof-v} (renamed to citebound)" \
            --notes "Final release under the old name. Install \`citebound\` instead: https://pypi.org/project/citebound/"
